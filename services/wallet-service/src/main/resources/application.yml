server:
  port: 8084
  servlet:
    context-path: /wallet
  error:
    include-message: always   # surface ResponseStatusException reasons in the JSON body

spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wallet_db}
    username: ${DB_USER:gozone}
    password: ${DB_PASS:gozone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET}   # required — no default; inject via env/secrets (see .env.example)
    issuer: ${JWT_ISSUER:gozone-auth}      # required on every token we accept
    audience: ${JWT_AUDIENCE:gozone-apps}
  internal:
    key: ${INTERNAL_KEY}   # required — shared secret for service-to-service settlement (no default)
  expo:
    access-token: ${EXPO_ACCESS_TOKEN:}
    push-url: https://exp.host/--/api/v2/push/send
  paystack:
    # "mock" (default) = no external calls, sandbox checkout. Set a real sk_test_… / sk_live_…
    # key via the PAYSTACK_SECRET_KEY env var to hit the real Paystack API. Never hardcode a key.
    secret-key: ${PAYSTACK_SECRET_KEY:mock}

logging:
  level:
    com.gozone.wallet: DEBUG
