server:
  port: 8081
  servlet:
    context-path: /auth
  error:
    include-message: always   # surface ResponseStatusException reasons in the JSON body

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:gozone}
    password: ${DB_PASS:gozone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Gmail SMTP for email verification codes. Blank username = not configured, and the
  # code is logged instead of emailed (so the demo still works offline).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    # Adding spring-boot-starter-mail registers a MailHealthIndicator that opens an SMTP
    # connection on every health check. A mail problem must never mark auth unhealthy
    # (verification codes fall back to logging), so keep it out of the health aggregate.
    mail:
      enabled: false

app:
  jwt:
    # RS256: only auth-service gets the private key, because only auth-service mints tokens.
    # Both values are base64 of the DER bytes (single line — see RsaKeys).
    private-key: ${JWT_PRIVATE_KEY}   # required — auth-service only, never share
    public-key: ${JWT_PUBLIC_KEY}     # required — safe to distribute; cannot sign
    # Access tokens can't be revoked, so they expire quickly; clients swap the 7-day refresh
    # token (which CAN be revoked — see /auth/logout) for a new one.
    expiry-ms: ${JWT_EXPIRY_MS:3600000}            # 1 hour
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days
    issuer: ${JWT_ISSUER:gozone-auth}      # stamped on every token; verifiers require it
    audience: ${JWT_AUDIENCE:gozone-apps}
  internal:
    key: ${INTERNAL_KEY}    # required — shared secret for internal service-to-service calls
  superadmin:
    # Bootstrap super-admin password. Blank = a strong random one is generated + logged once.
    password: ${SUPERADMIN_PASSWORD:}
  mail:
    from-name: ${MAIL_FROM_NAME:GoZone}
  google:
    # Comma-separated OAuth client IDs (web,android,ios) that may sign in.
    # Blank = audience check skipped (dev only — set these before any real use).
    client-ids: ${GOOGLE_CLIENT_IDS:}
  sms:
    # "africastalking" or "twilio". Unconfigured = the OTP is logged (demo default).
    provider: ${SMS_PROVIDER:africastalking}
    at:
      username: ${AT_USERNAME:}     # "sandbox" for the free Africa's Talking sandbox
      api-key: ${AT_API_KEY:}
      sender-id: ${AT_SENDER_ID:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
  otp:
    expiry-minutes: 5
    # Dev only: also log the code after a successful SMS/email send so a demo can
    # continue if the handset/simulator isn't reachable. Set false in production.
    log-codes: ${OTP_LOG_CODES:true}

logging:
  level:
    com.gozone.auth: DEBUG
