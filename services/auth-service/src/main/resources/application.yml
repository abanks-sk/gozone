server:
  # Railway (and most PaaS) inject PORT and route only to that port; a hardcoded
  # 8081 would leave the service unreachable in production while working locally.
  # The default keeps docker-compose and local runs exactly as they were.
  port: ${PORT:8081}
  servlet:
    context-path: /auth
  error:
    include-message: always   # surface ResponseStatusException reasons in the JSON body

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:gozone}
    password: ${DB_PASS:gozone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Sized a little above app.uploads.max-bytes so an oversized image is refused by our own
      # check with a readable message, rather than by the container with an opaque 500.
      max-file-size: 8MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    # RS256: only auth-service gets the private key, because only auth-service mints tokens.
    # Both values are base64 of the DER bytes (single line — see RsaKeys).
    private-key: ${JWT_PRIVATE_KEY}   # required — auth-service only, never share
    public-key: ${JWT_PUBLIC_KEY}     # required — safe to distribute; cannot sign
    # Retired public keys (comma-separated) still published in the JWKS and still accepted,
    # so a rotation doesn't invalidate the access tokens already in people's hands.
    # Empty in steady state; see docs/DEPLOYMENT.md for the rotation procedure.
    previous-public-keys: ${JWT_PREVIOUS_PUBLIC_KEYS:}
    # Access tokens can't be revoked, so they expire quickly; clients swap the 7-day refresh
    # token (which CAN be revoked — see /auth/logout) for a new one.
    expiry-ms: ${JWT_EXPIRY_MS:3600000}            # 1 hour
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days
    issuer: ${JWT_ISSUER:gozone-auth}      # stamped on every token; verifiers require it
    audience: ${JWT_AUDIENCE:gozone-apps}
  internal:
    key: ${INTERNAL_KEY}    # required — shared secret for internal service-to-service calls
  superadmin:
    # Bootstrap super-admin password. Blank = a strong random one is generated + logged once.
    password: ${SUPERADMIN_PASSWORD:}
  mail:
    from-name: ${MAIL_FROM_NAME:GoZone}
    # Brevo's HTTP API. SMTP was dropped because PaaS hosts block outbound mail ports — it
    # worked locally and would have gone quiet on deploy with no error. Blank key or sender =
    # the code is logged instead of emailed.
    brevo:
      api-key: ${BREVO_API_KEY:}
      # Must be an address/domain verified in Brevo, or sends are rejected.
      sender: ${BREVO_SENDER_EMAIL:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  google:
    # Comma-separated OAuth client IDs (web,android,ios) that may sign in.
    # Blank = audience check skipped (dev only — set these before any real use).
    client-ids: ${GOOGLE_CLIENT_IDS:}
  sms:
    # Providers are tried in order: Arkesel → Termii → Brevo. Each is skipped when its key is
    # blank, and the next is only tried when the previous one actually FAILS — so nothing is
    # ever sent twice. Blank all three and the OTP is logged, which is also the fallback when
    # every provider fails.
    arkesel:
      api-key: ${ARKESEL_API_KEY:}
      sender: ${ARKESEL_SENDER:GoZone}     # alphanumeric, max 11 chars, must be approved
      base-url: ${ARKESEL_BASE_URL:https://sms.arkesel.com}
    # Termii is a secondary provider. Africa's Talking and Twilio were removed rather than left
    # switchable — nobody holds credentials for them, and an unused branch still has to be read.
    # Unconfigured = the OTP is logged (which is also the state while the sender ID is pending).
    termii:
      api-key: ${TERMII_API_KEY:}
      # Must be a sender ID Termii has APPROVED. Until it is, sends are rejected and the app
      # falls back to the logged code — see SmsService.logCodes.
      sender-id: ${TERMII_SENDER_ID:GoZone}
      # "generic" is the ordinary route; "dnd" reaches do-not-disturb numbers.
      channel: ${TERMII_CHANNEL:generic}
      base-url: ${TERMII_BASE_URL:https://api.ng.termii.com}
    # Fallback, tried only when Termii actually fails. Uses the same BREVO_API_KEY as email —
    # one Brevo account, several endpoints. Brevo SMS is credit-based: no credits = refused send.
    brevo:
      sender: ${BREVO_SMS_SENDER:GoZone}   # alphanumeric, max 11 chars
  otp:
    expiry-minutes: 5
    # Also write the code to the log, whether or not the SMS/email send succeeded.
    #
    # ⚠️ Anyone who can read the logs can sign in as anyone. This stays TRUE deliberately while
    # the Termii sender ID is awaiting approval (days), because without it there is no way to
    # sign in at all on a hosted stack where the logs are the only channel that works.
    # Flip to false the moment Termii is approved.
    log-codes: ${OTP_LOG_CODES:true}
  uploads:
    # KYC documents. Must point at a mounted volume — see docker-compose.yml. Written into the
    # container's own filesystem, every driver's documents die with the next rebuild.
    dir: ${UPLOAD_DIR:/var/gozone/uploads}
    # 6 MB. Comfortably above a phone photo after the picker's compression, well below anything
    # that would make holding the bytes in memory a problem.
    max-bytes: ${UPLOAD_MAX_BYTES:6291456}

logging:
  level:
    com.gozone.auth: DEBUG
