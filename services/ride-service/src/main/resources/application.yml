server:
  port: 8082
  servlet:
    context-path: /rides
  error:
    include-message: always   # surface ResponseStatusException reasons in the JSON body

spring:
  application:
    name: ride-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ride_db}
    username: ${DB_USER:gozone}
    password: ${DB_PASS:gozone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    # Verify only: the public key can check a signature but never create one, so a
    # break here does not hand over the ability to mint tokens.
    public-key: ${JWT_PUBLIC_KEY}   # required — base64 DER (see RsaKeys)
    # Where the verification keys actually come from. Fetched on a background thread and cached
    # by kid, so rotating the key pair is a restart of auth-service alone rather than of all five
    # services. The public-key above stays as the fallback: if auth is unreachable or this URL is
    # blank, verification still works with the configured key.
    jwks-url: ${JWKS_URL:}
    jwks-refresh-ms: ${JWKS_REFRESH_MS:300000}   # 5 minutes
    issuer: ${JWT_ISSUER:gozone-auth}      # required on every token we accept
    audience: ${JWT_AUDIENCE:gozone-apps}
  internal:
    key: ${INTERNAL_KEY}   # required — shared secret for wallet settlement calls (no default)
  services:
    wallet-url: ${WALLET_SERVICE_URL:http://localhost:8084}
    notify-url: ${NOTIFY_URL:http://localhost:8084/wallet/notify}
  pooling:
    # How near the joiner's destination has to be to where the car is already heading.
    max-distance-km: ${POOL_MAX_DEST_GAP_KM:3.0}
    # How far off the car's remaining line the joiner's pickup may sit — the detour being asked for.
    max-detour-km: ${POOL_MAX_DETOUR_KM:2.0}
    # "Routes align": how far the joiner's direction of travel may differ from the car's, in degrees.
    # Without this, somebody driving the same road the other way looks like a perfect match.
    max-bearing-deg: ${POOL_MAX_BEARING_DEG:50}
    # Seats. A saloon carries four, but three strangers plus a driver is the practical ceiling.
    max-passengers: ${POOL_MAX_PASSENGERS:3}
    # Each extra passenger takes this much off EVERY passenger's own solo fare.
    # Two people at 75% each pays the driver 150% of one fare — which is why sharing is worth
    # running at all, rather than a discount the driver quietly funds.
    discount-per-extra: ${POOL_DISCOUNT_PER_EXTRA:0.25}
    # Floor, so a full car never approaches free.
    min-discount-factor: ${POOL_MIN_DISCOUNT_FACTOR:0.55}
    # How long a driver has to undo a pickup they confirmed by mistake. Deliberately short: a
    # mis-tap is noticed within seconds, whereas an open-ended undo turns "the passenger is aboard
    # and owes the fare" back into something the driver can revoke at any point in the journey.
    pickup-undo-seconds: ${POOL_PICKUP_UNDO_SECONDS:300}
    rule-version: v1
  ride:
    request-ttl-seconds: 90    # Immediate requests auto-expire after this if no driver takes them
    expiry-sweep-ms: 30000     # How often the background sweep runs
  maps:
    # Google Maps SERVER key (Directions/Places/Geocoding). Blank = proxy returns empty
    # results and the app falls back (straight-line route, no place search). Never in the app.
    server-key: ${GOOGLE_MAPS_SERVER_KEY:}

logging:
  level:
    com.gozone.ride: DEBUG
