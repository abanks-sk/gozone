server:
  port: 8082
  servlet:
    context-path: /rides

spring:
  application:
    name: ride-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ride_db}
    username: ${DB_USER:gozone}
    password: ${DB_PASS:gozone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:gozone-super-secret-jwt-key-minimum-256-bits-padpadpad}
  services:
    wallet-url: ${WALLET_SERVICE_URL:http://localhost:8084}
    notify-url: ${NOTIFY_URL:http://localhost:8084/notify}
  pooling:
    max-distance-km: 3.0       # Reject pool candidates beyond this from the route
    rule-version: v1

logging:
  level:
    com.gozone.ride: DEBUG
