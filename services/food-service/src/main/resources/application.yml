server:
  port: 8083
  servlet:
    context-path: /food
  error:
    include-message: always   # surface ResponseStatusException reasons in the JSON body

spring:
  application:
    name: food-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:food_db}
    username: ${DB_USER:gozone}
    password: ${DB_PASS:gozone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET}   # required — no default; inject via env/secrets (see .env.example)
    issuer: ${JWT_ISSUER:gozone-auth}      # required on every token we accept
    audience: ${JWT_AUDIENCE:gozone-apps}
  internal:
    key: ${INTERNAL_KEY}   # required — shared secret for wallet settlement calls (no default)
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}   # delivery-rider availability check
  services:
    wallet-url: ${WALLET_SERVICE_URL:http://localhost:8084}
    notify-url: ${NOTIFY_URL:http://localhost:8084/notify}
  delivery:
    base-fee: 2.00       # GH₵ base delivery fee
    per-km-fee: 1.50     # GH₵ per km (haversine)

logging:
  level:
    com.gozone.food: DEBUG
