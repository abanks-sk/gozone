server:
  port: 8083
  servlet:
    context-path: /food

spring:
  application:
    name: food-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:food_db}
    username: ${DB_USER:gozone}
    password: ${DB_PASS:gozone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:gozone-super-secret-jwt-key-minimum-256-bits-padpadpad}
  services:
    wallet-url: ${WALLET_SERVICE_URL:http://localhost:8084}
    notify-url: ${NOTIFY_URL:http://localhost:8084/notify}
  delivery:
    base-fee: 2.00       # GH₵ base delivery fee
    per-km-fee: 1.50     # GH₵ per km (haversine)

logging:
  level:
    com.gozone.food: DEBUG
