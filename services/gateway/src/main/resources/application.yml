server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**

        - id: rides
          uri: ${RIDE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/rides/**

        - id: food
          uri: ${FOOD_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/food/**

        - id: wallet
          uri: ${WALLET_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/wallet/**

        - id: notify
          uri: ${WALLET_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/notify
          filters:
            - RewritePath=/notify, /wallet/notify

      # Forward WebSocket upgrades transparently
      globalcors:
        # Let the gateway answer CORS preflight (OPTIONS) itself instead of
        # forwarding it downstream, where Spring Security would reject it.
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: "*"

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    # Verify only: the public key can check a signature but never create one, so a
    # break here does not hand over the ability to mint tokens.
    public-key: ${JWT_PUBLIC_KEY}   # required — base64 DER (see RsaKeys)
    # Where the verification keys actually come from. Fetched on a background thread and cached
    # by kid, so rotating the key pair is a restart of auth-service alone rather than of all five
    # services. The public-key above stays as the fallback: if auth is unreachable or this URL is
    # blank, verification still works with the configured key.
    jwks-url: ${JWKS_URL:}
    jwks-refresh-ms: ${JWKS_REFRESH_MS:300000}   # 5 minutes
    issuer: ${JWT_ISSUER:gozone-auth}      # must match auth-service; tokens without it are rejected
    audience: ${JWT_AUDIENCE:gozone-apps}
  ratelimit:
    # Per-caller (per-IP) request caps, counted in memory per gateway instance — see
    # RateLimitFilter for why these are generous: carriers NAT many users behind one IP, and
    # per-account abuse is bounded separately by the 5-attempt OTP cap. Scaling past one
    # gateway instance means moving to the Redis-backed RequestRateLimiter.
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-window: ${RATE_LIMIT_AUTH:40}
    default-per-window: ${RATE_LIMIT_DEFAULT:600}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  gateway:
    # Paths that bypass the JWT check at the gateway edge (pre-login flows).
    # Comma-separated so it binds cleanly to a List<String> via @Value.
    # /auth/.well-known/jwks.json is here because a JWKS is public by definition — it carries
    # verification keys, which cannot sign. Services fetch it over the internal network, but
    # exposing it is standard and makes the key set inspectable from outside.
    public-paths: /auth/google,/auth/register,/auth/register-email,/auth/login,/auth/login-email,/auth/login-email-password,/auth/verify-otp,/auth/refresh,/auth/admin/login,/auth/.well-known/,/wallet/mock-checkout,/actuator

logging:
  level:
    org.springframework.cloud.gateway: INFO
