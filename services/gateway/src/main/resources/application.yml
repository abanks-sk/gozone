server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**

        - id: rides
          uri: ${RIDE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/rides/**

        - id: food
          uri: ${FOOD_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/food/**

        - id: wallet
          uri: ${WALLET_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/wallet/**

        - id: notify
          uri: ${WALLET_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/notify
          filters:
            - RewritePath=/notify, /wallet/notify

      # Forward WebSocket upgrades transparently
      globalcors:
        # Let the gateway answer CORS preflight (OPTIONS) itself instead of
        # forwarding it downstream, where Spring Security would reject it.
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: "*"

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET}   # required — no default; inject via env/secrets (see .env.example)
  gateway:
    # Paths that bypass the JWT check at the gateway edge (pre-login flows).
    # Comma-separated so it binds cleanly to a List<String> via @Value.
    public-paths: /auth/google,/auth/register,/auth/register-email,/auth/login,/auth/login-email,/auth/login-email-password,/auth/verify-otp,/auth/refresh,/auth/admin/login,/wallet/mock-checkout,/actuator

logging:
  level:
    org.springframework.cloud.gateway: INFO
