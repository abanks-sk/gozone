name: GoZone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Start services
        run: docker compose up -d --build
      - name: Wait for services to be ready
        run: sleep 30
      - name: Run smoke test
        run: bash scripts/smoke-test.sh
      - name: Tear down
        if: always()
        run: docker compose down
