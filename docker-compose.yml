services:
  postgres:
    image: postgres:16
    container_name: gozone-postgres
    environment:
      POSTGRES_USER: gozone
      POSTGRES_PASSWORD: gozone123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gozone"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./services/gateway
    container_name: gozone-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      RIDE_SERVICE_URL: http://ride-service:8082
      FOOD_SERVICE_URL: http://food-service:8083
      WALLET_SERVICE_URL: http://wallet-service:8084
    depends_on:
      - auth-service
      - ride-service
      - food-service
      - wallet-service

  auth-service:
    build: ./services/auth-service
    container_name: gozone-auth
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: gozone
      SPRING_DATASOURCE_PASSWORD: gozone123
      JWT_SECRET: gozone-super-secret-jwt-key-change-in-production
      JWT_EXPIRY_HOURS: 24
    depends_on:
      postgres:
        condition: service_healthy

  ride-service:
    build: ./services/ride-service
    container_name: gozone-ride
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ride_db
      SPRING_DATASOURCE_USERNAME: gozone
      SPRING_DATASOURCE_PASSWORD: gozone123
      JWT_SECRET: gozone-super-secret-jwt-key-change-in-production
      WALLET_SERVICE_URL: http://wallet-service:8084
      NOTIFY_SERVICE_URL: http://wallet-service:8084
    depends_on:
      postgres:
        condition: service_healthy

  food-service:
    build: ./services/food-service
    container_name: gozone-food
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/food_db
      SPRING_DATASOURCE_USERNAME: gozone
      SPRING_DATASOURCE_PASSWORD: gozone123
      JWT_SECRET: gozone-super-secret-jwt-key-change-in-production
      WALLET_SERVICE_URL: http://wallet-service:8084
      NOTIFY_SERVICE_URL: http://wallet-service:8084
    depends_on:
      postgres:
        condition: service_healthy

  wallet-service:
    build: ./services/wallet-service
    container_name: gozone-wallet
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: gozone
      SPRING_DATASOURCE_PASSWORD: gozone123
      JWT_SECRET: gozone-super-secret-jwt-key-change-in-production
      EXPO_PUSH_URL: https://exp.host/--/api/v2/push/send
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: