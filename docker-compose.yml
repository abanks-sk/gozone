version: '3.9'

services:

  # ── Shared Postgres (4 logical DBs) ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: gozone-postgres
    environment:
      POSTGRES_USER: gozone
      POSTGRES_PASSWORD: gozone
      POSTGRES_DB: gozone_main
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gozone -d gozone_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway (port 8080 — only public entry point) ────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gozone-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      RIDE_SERVICE_URL: http://ride-service:8082
      FOOD_SERVICE_URL: http://food-service:8083
      WALLET_SERVICE_URL: http://wallet-service:8084
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set — copy .env.example to .env}
      JWKS_URL: http://auth-service:8081/auth/.well-known/jwks.json
      INTERNAL_KEY: ${INTERNAL_KEY:?INTERNAL_KEY must be set — copy .env.example to .env}
    depends_on:
      auth-service:
        condition: service_healthy
      ride-service:
        condition: service_healthy
      food-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
    restart: on-failure

  # ── Auth / Identity Service (port 8081) ─────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: gozone-auth
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: gozone
      DB_PASS: gozone
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set — copy .env.example to .env}
      # auth-service alone can sign — no other service is given this.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set — copy .env.example to .env}
      # Retired keys, still published in the JWKS and still accepted, so a rotation does not
      # invalidate tokens already issued. Normally empty — see docs/DEPLOYMENT.md section 3.
      JWT_PREVIOUS_PUBLIC_KEYS: ${JWT_PREVIOUS_PUBLIC_KEYS:-}
      INTERNAL_KEY: ${INTERNAL_KEY:?INTERNAL_KEY must be set — copy .env.example to .env}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      OTP_LOG_CODES: ${OTP_LOG_CODES:-true}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SMS_SENDER: ${BREVO_SMS_SENDER:-GoZone}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GoZone}
      ARKESEL_API_KEY: ${ARKESEL_API_KEY:-}
      ARKESEL_SENDER: ${ARKESEL_SENDER:-GoZone}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-GoZone}
      TERMII_CHANNEL: ${TERMII_CHANNEL:-generic}
      UPLOAD_DIR: /var/gozone/uploads
    volumes:
      # KYC documents live on a named volume, NOT in the container's own filesystem.
      # This service is rebuilt constantly; written anywhere else, every driver's licence and
      # photograph would be destroyed by the next `docker compose build auth-service`.
      - kyc_uploads:/var/gozone/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/auth/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    restart: on-failure

  # ── Ride Service — GoRide (port 8082) ────────────────────────────────────────
  ride-service:
    build:
      context: ./services/ride-service
      dockerfile: Dockerfile
    container_name: gozone-ride
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ride_db
      DB_USER: gozone
      DB_PASS: gozone
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set — copy .env.example to .env}
      JWKS_URL: http://auth-service:8081/auth/.well-known/jwks.json
      INTERNAL_KEY: ${INTERNAL_KEY:?INTERNAL_KEY must be set — copy .env.example to .env}
      AUTH_SERVICE_URL: http://auth-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8084
      NOTIFY_URL: http://wallet-service:8084/wallet/notify
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/rides/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    restart: on-failure

  # ── Food Service — GoBite (port 8083) ────────────────────────────────────────
  food-service:
    build:
      context: ./services/food-service
      dockerfile: Dockerfile
    container_name: gozone-food
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: food_db
      DB_USER: gozone
      DB_PASS: gozone
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set — copy .env.example to .env}
      JWKS_URL: http://auth-service:8081/auth/.well-known/jwks.json
      INTERNAL_KEY: ${INTERNAL_KEY:?INTERNAL_KEY must be set — copy .env.example to .env}
      WALLET_SERVICE_URL: http://wallet-service:8084
      NOTIFY_URL: http://wallet-service:8084/wallet/notify
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/food/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    restart: on-failure

  # ── Wallet + Notification Service (port 8084) ─────────────────────────────────
  wallet-service:
    build:
      context: ./services/wallet-service
      dockerfile: Dockerfile
    container_name: gozone-wallet
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wallet_db
      DB_USER: gozone
      DB_PASS: gozone
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set — copy .env.example to .env}
      JWKS_URL: http://auth-service:8081/auth/.well-known/jwks.json
      INTERNAL_KEY: ${INTERNAL_KEY:?INTERNAL_KEY must be set — copy .env.example to .env}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-mock}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/wallet/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    restart: on-failure

volumes:
  postgres_data:
  # Driver KYC documents. Survives rebuilds of auth-service by design — see the note on the
  # service's volume mount. Backing this up is backing up people's identity documents.
  kyc_uploads:
