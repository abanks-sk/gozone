openapi: "3.0.3"
info:
  title: GoZone Auth Service
  version: "1.0.0"
  description: |
    Identity, OTP, JWT, RBAC and driver KYC.
    OTP is printed to server logs in dev (FR-01).
servers:
  - url: http://localhost:8080/auth
    description: Via gateway (dev)

tags:
  - name: auth
  - name: kyc

paths:
  /register:
    post:
      tags: [auth]
      summary: Register phone + role; issues OTP to logs
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /verify-otp:
    post:
      tags: [auth]
      summary: Verify OTP; returns JWT access + refresh pair
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: JWT pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token; returns new JWT pair
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New JWT pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [auth]
      summary: Current user profile
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /driver/kyc:
    post:
      tags: [kyc]
      summary: Driver submits KYC document references
      operationId: submitKyc
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycSubmitRequest'
      responses:
        '200':
          description: KYC record created (PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /driver/kyc/{id}:
    patch:
      tags: [kyc]
      summary: Admin approves or rejects KYC
      operationId: reviewKyc
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycReviewRequest'
      responses:
        '200':
          description: KYC updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [phone, role]
      properties:
        phone:
          type: string
          example: "+233501234567"
        role:
          type: string
          enum: [RIDER, DRIVER, RESTAURANT_OWNER, COURIER, ADMIN]

    RegisterResponse:
      type: object
      properties:
        phone:
          type: string
        message:
          type: string

    VerifyOtpRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        role:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]

    KycSubmitRequest:
      type: object
      properties:
        licenceNo:
          type: string
        vehicleReg:
          type: string
        roadworthyUrl:
          type: string
        idSelfieUrl:
          type: string

    KycReviewRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [VERIFIED, REJECTED]
        expiryDate:
          type: string
          format: date

    KycResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        licenceNo:
          type: string
        vehicleReg:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
