openapi: "3.0.3"
info:
  title: GoZone Auth Service
  version: "1.0.0"
  description: |
    Identity, OTP, JWT, RBAC and driver KYC.
    OTP is printed to server logs in dev (FR-01).
servers:
  - url: http://localhost:8080/auth
    description: Via gateway (dev)

tags:
  - name: auth
  - name: kyc

paths:

  /auth/me/vehicle:
    patch:
      tags: [Account]
      summary: A driver corrects their own vehicle — only while unapproved
      description: >
        Answers 409 once the account is ACTIVE. From then on the vehicle is part of what the admin
        verified, and a driver who could rewrite their own plate could put a different vehicle on
        the road under a verified identity. Changing it after approval goes through support.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleMake: { type: string }
                vehicleModel: { type: string }
                vehicleColour: { type: string }
                vehiclePlate: { type: string }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '403': { description: Not a driver }
        '409': { description: Account already approved — the vehicle is locked }

  /auth/users/{id}:
    get:
      tags: [Admin]
      summary: One applicant in full — account details, and a driver's documents with them
      description: >
        The approvals list showed a name and a role, which is not enough to approve anybody. Note
        that approving a driver through PATCH /auth/users/{id}/status also marks their latest KYC
        submission reviewed: they are one judgement about one person.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Applicant
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserResponse' }
                  createdAt: { type: string, format: date-time }
                  kyc:
                    allOf: [{ $ref: '#/components/schemas/KycResponse' }]
                    nullable: true
                    description: Drivers and couriers only; null when nothing has been submitted.
        '403': { description: Not an admin }
        '404': { description: No such user }
  /register:
    post:
      tags: [auth]
      summary: Sign up (phone + role); creates the account and issues OTP to logs
      description: >
        Sign-up only. A phone that already has an account returns 409 so the client can
        steer the user to log in instead of silently logging into the existing account.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account with this phone already exists

  /login:
    post:
      tags: [auth]
      summary: Login (phone-only); issues OTP only if the phone already has an account
      description: >
        Unlike /register this never creates a user. An unknown phone returns 404 so the
        client can steer the user to sign up instead of silently creating an account.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No account found for this phone

  /register-email:
    post:
      tags: [auth]
      summary: Email sign-up; creates the account and issues OTP to the email (logged in dev)
      operationId: registerEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRegisterRequest'
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account with this email already exists

  /login-email:
    post:
      tags: [auth]
      summary: Email login; issues OTP only if the email already has an account
      operationId: loginEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLoginRequest'
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No account found for this email

  /verify-otp:
    post:
      tags: [auth]
      summary: Verify OTP; returns JWT access + refresh pair
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: JWT pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /logout:
    post:
      tags: [auth]
      summary: End the session by revoking the refresh token
      description: >
        Access tokens are stateless and expire on their own (1h); the refresh token is the
        revocable part, so logout kills that. Omit refreshToken (or send allDevices=true) to
        revoke every session for the caller. Presenting another user's refresh token does
        nothing.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                allDevices:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'

  /refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token; returns new JWT pair
      description: >
        Single use — the presented token is revoked as part of the exchange, so a captured
        refresh token stops working as soon as the real client next refreshes.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New JWT pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [auth]
      summary: Current user profile
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [auth]
      summary: Edit your own display name / username
      description: >
        Phone and email are login credentials and are not editable here — they change
        through /me/phone and /me/email, which verify the new value with a code first.
        Omitted fields are left unchanged; a blank value is rejected.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Blank name, or a malformed / too-short username
        '403':
          description: Admin usernames are super-admin managed
        '409':
          description: That username is already taken
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/login:
    post:
      tags: [admin]
      summary: Admin step 1 — username + password; on success OTPs the phone on file
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Credentials valid; OTP sent. Complete with /verify-otp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'

  /admins:
    post:
      tags: [admin]
      summary: Super admin creates an ADMIN account
      operationId: createAdmin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '200':
          description: Admin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users:
    get:
      tags: [admin]
      summary: Admin lists users by status (e.g. PENDING approvals)
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, PENDING, REJECTED]
      responses:
        '200':
          description: Users with that status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /uploads:
    post:
      tags: [kyc]
      summary: Upload a KYC document
      description: >
        Multipart image upload. The declared Content-Type is ignored — the bytes are sniffed and
        only real JPEG, PNG or WebP is accepted, because "profile.jpg" containing a script is the
        obvious attack on a folder that later serves files back. The stored filename is generated
        server-side and never derived from the client's, which is what makes path traversal
        impossible. Max 6 MB (`app.uploads.max-bytes`).
        Returns a **relative** URL: the app already knows the gateway address and it changes with
        the network, so an absolute URL would pin a driver's documents to whatever host the server
        had the day they signed up.
      operationId: uploadDocument
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:  { type: string, format: uuid }
                  url: { type: string, example: /auth/uploads/6f1c… }
        '413':
          description: Image too large
        '415':
          description: Not a JPEG, PNG or WebP once the bytes are inspected

  /uploads/{id}:
    get:
      tags: [kyc]
      summary: Fetch an uploaded document
      description: >
        Served only to the uploader or to an ADMIN/SUPER_ADMIN. These are identity documents, so
        holding the URL is deliberately **not** the same as being allowed to read it — a link can
        end up in a log, a screenshot or a forwarded message.
        A caller who is not entitled gets **404, not 403**: a 403 would confirm the document
        exists, which is itself something a stranger should not learn about someone's ID.
      operationId: getUpload
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png:  { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404':
          description: No such document, or not yours

  /users/awaiting-class:
    get:
      tags: [admin]
      summary: Drivers and couriers still waiting on a vehicle class
      description: >
        Not reachable via /users?status=. A driver who registers a car is class-null from sign-up
        and stays class-null after approval, so a status filter loses them the moment they become
        ACTIVE — while their own app still reads "Awaiting admin". Approving the person and
        grading their vehicle are separate judgements, so they get separate lists.
        Excludes REJECTED accounts; ordered newest first.
      operationId: listAwaitingVehicleClass
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Drivers with no vehicle class set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/status:
    patch:
      tags: [admin]
      summary: Admin approves (ACTIVE) or rejects (REJECTED) a pending account
      operationId: reviewUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, REJECTED, SUSPENDED]
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/class:
    patch:
      tags: [admin]
      summary: Admin assigns a driver's vehicle class (e.g. Standard/Luxe after seeing the car)
      operationId: assignVehicleClass
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleClass]
              properties:
                vehicleClass:
                  type: string
                  enum: [OKADA, STANDARD, LUXE, CARGO]
      responses:
        '200':
          description: Class assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/service-mode:
    patch:
      tags: [auth]
      summary: Driver sets their own service mode
      operationId: setServiceMode
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [RIDES, DELIVERIES, BOTH]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /driver/kyc:
    post:
      tags: [kyc]
      summary: Driver submits KYC document references
      operationId: submitKyc
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycSubmitRequest'
      responses:
        '200':
          description: KYC record created (PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [kyc]
      summary: Admin lists KYC submissions (optionally by status)
      operationId: listKyc
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, VERIFIED, REJECTED]
      responses:
        '200':
          description: KYC submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KycResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /driver/kyc/{id}:
    patch:
      tags: [kyc]
      summary: Admin approves or rejects KYC
      operationId: reviewKyc
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycReviewRequest'
      responses:
        '200':
          description: KYC updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [phone, role]
      properties:
        phone:
          type: string
          example: "+233501234567"
        role:
          type: string
          enum: [RIDER, DRIVER, RESTAURANT_OWNER, COURIER]
          description: >
            ADMIN and SUPER_ADMIN are rejected with 403 — an admin is created only by a
            SUPER_ADMIN through POST /auth/admins.
        name:
          type: string
          description: Display name — sent on first-time sign-up; ignored for an existing phone
        vehicleClass:
          type: string
          enum: [OKADA, CARGO]
          description: Driver self-selected class at sign-up (Okada/Truck). Omit for a car → admin sets Standard/Luxe.
        vehicleMake: { type: string }
        vehicleModel: { type: string }
        vehicleColour: { type: string }
        vehiclePlate:
          type: string
          description: >
            Registration plate, stored upper-cased with runs of whitespace collapsed. Required by
            the driver app at sign-up: it is what ties a driver to the vehicle on the road.
        app:
          type: string
          enum: [PASSENGER, DRIVER, VENDOR, ADMIN]
          description: >
            Which app is asking. Accounts are scoped to it, so one number can hold a separate
            passenger, driver and vendor account. Optional: on sign-up the server infers it from
            the role, and on sign-in from the single account that matches. An app that holds
            accounts in more than one app must send it.

    LoginRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: "+233501234567"
        app:
          type: string
          enum: [PASSENGER, DRIVER, VENDOR, ADMIN]
          description: >
            Which app is asking. Accounts are scoped to it, so one number can hold a separate
            passenger, driver and vendor account. Optional: on sign-up the server infers it from
            the role, and on sign-in from the single account that matches. An app that holds
            accounts in more than one app must send it.

    EmailRegisterRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: "ama@example.com"
        role:
          type: string
          enum: [RIDER, DRIVER, RESTAURANT_OWNER, COURIER]
        name:
          type: string
        app:
          type: string
          enum: [PASSENGER, DRIVER, VENDOR, ADMIN]
          description: >
            Which app is asking. Accounts are scoped to it, so one number can hold a separate
            passenger, driver and vendor account. Optional: on sign-up the server infers it from
            the role, and on sign-in from the single account that matches. An app that holds
            accounts in more than one app must send it.

    EmailLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        app:
          type: string
          enum: [PASSENGER, DRIVER, VENDOR, ADMIN]
          description: >
            Which app is asking. Accounts are scoped to it, so one number can hold a separate
            passenger, driver and vendor account. Optional: on sign-up the server infers it from
            the role, and on sign-in from the single account that matches. An app that holds
            accounts in more than one app must send it.

    RegisterResponse:
      type: object
      properties:
        phone:
          type: string
        message:
          type: string

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminLoginResponse:
      type: object
      properties:
        phone:
          type: string
          description: Phone the OTP was sent to (use it in /verify-otp)
        message:
          type: string

    CreateAdminRequest:
      type: object
      required: [name, username, password, phone]
      properties:
        name:
          type: string
        username:
          type: string
        password:
          type: string
        phone:
          type: string

    VerifyOtpRequest:
      type: object
      required: [code]
      description: Provide exactly one of phone or email (matching how the OTP was requested).
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        code:
          type: string
        app:
          type: string
          enum: [PASSENGER, DRIVER, VENDOR, ADMIN]
          description: >
            Which app is asking. Accounts are scoped to it, so one number can hold a separate
            passenger, driver and vendor account. Optional: on sign-up the server infers it from
            the role, and on sign-in from the single account that matches. An app that holds
            accounts in more than one app must send it.

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        role:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UpdateProfileRequest:
      type: object
      description: Fields omitted (null) are left unchanged.
      properties:
        name:
          type: string
          maxLength: 100
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-z0-9._]{3,30}$'
          description: Lower-cased server-side; unique across all accounts

    UserResponse:
      type: object
      properties:
        vehicleMake: { type: string }
        vehicleModel: { type: string }
        vehicleColour: { type: string }
        vehiclePlate:
          type: string
          description: >
            Registration plate, stored upper-cased with runs of whitespace collapsed. Required by
            the driver app at sign-up: it is what ties a driver to the vehicle on the road.
        statusNote:
          type: string
          nullable: true
          description: >
            Why the account is in this status, written by the reviewing admin. Required when
            rejecting (the server answers 400 without one) and cleared on approval — the applicant
            is shown it, so a refusal can be acted on instead of prompting a call to support.
        id:
          type: string
          format: uuid
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        role:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, PENDING, REJECTED]
        vehicleClass:
          type: string
          nullable: true
          enum: [OKADA, STANDARD, LUXE, CARGO]
          description: Driver class; null for a car awaiting an admin tier
        serviceMode:
          type: string
          enum: [RIDES, DELIVERIES, BOTH]

    KycSubmitRequest:
      type: object
      required: [idSelfieUrl, licenceUrl, vehiclePhotoUrl]
      description: >
        The three photographs are required, and each must be a path returned by POST /uploads.
        They were optional and in practice hardcoded placeholder strings the app never sent, so
        an admin pressing Approve was approving a URL that pointed at nothing. An off-platform
        link is refused too — otherwise a submission could point at a URL whose contents change
        after review.
      properties:
        licenceNo:
          type: string
        vehicleReg:
          type: string
        roadworthyUrl:
          type: string
          nullable: true
          description: Optional certificate.
        idSelfieUrl:
          type: string
          description: The driver's own photograph. Must start with /auth/uploads/.
        licenceUrl:
          type: string
          description: Photograph of the driving licence. Must start with /auth/uploads/.
        vehiclePhotoUrl:
          type: string
          description: Photograph of the vehicle. Must start with /auth/uploads/.

    KycReviewRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [VERIFIED, REJECTED]
        expiryDate:
          type: string
          format: date

    KycResponse:
      type: object
      properties:
        reviewNote:
          type: string
          nullable: true
          description: Why the documents were accepted or refused — shown to the driver.
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        licenceNo:
          type: string
        vehicleReg:
          type: string
        driverName:
          type: string
          nullable: true
          description: >
            Included because the admin list previously showed a truncated UUID — you cannot verify
            somebody's identity documents while looking at an id fragment.
        driverPhone:
          type: string
          nullable: true
        idSelfieUrl:
          type: string
          nullable: true
          description: >
            Relative path to the document. Fetching it still requires being that driver or an
            admin, so returning it here does not widen access.
        licenceUrl:
          type: string
          nullable: true
        vehiclePhotoUrl:
          type: string
          nullable: true
        roadworthyUrl:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
