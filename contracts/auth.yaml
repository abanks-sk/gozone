openapi: "3.0.3"
info:
  title: GoZone Auth Service
  version: "1.0.0"
  description: |
    Identity, OTP, JWT, RBAC and driver KYC.
    OTP is printed to server logs in dev (FR-01).
servers:
  - url: http://localhost:8080/auth
    description: Via gateway (dev)

tags:
  - name: auth
  - name: kyc

paths:
  /register:
    post:
      tags: [auth]
      summary: Sign up (phone + role); creates the account and issues OTP to logs
      description: >
        Sign-up only. A phone that already has an account returns 409 so the client can
        steer the user to log in instead of silently logging into the existing account.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account with this phone already exists

  /login:
    post:
      tags: [auth]
      summary: Login (phone-only); issues OTP only if the phone already has an account
      description: >
        Unlike /register this never creates a user. An unknown phone returns 404 so the
        client can steer the user to sign up instead of silently creating an account.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No account found for this phone

  /register-email:
    post:
      tags: [auth]
      summary: Email sign-up; creates the account and issues OTP to the email (logged in dev)
      operationId: registerEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRegisterRequest'
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account with this email already exists

  /login-email:
    post:
      tags: [auth]
      summary: Email login; issues OTP only if the email already has an account
      operationId: loginEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLoginRequest'
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No account found for this email

  /verify-otp:
    post:
      tags: [auth]
      summary: Verify OTP; returns JWT access + refresh pair
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: JWT pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /logout:
    post:
      tags: [auth]
      summary: End the session by revoking the refresh token
      description: >
        Access tokens are stateless and expire on their own (1h); the refresh token is the
        revocable part, so logout kills that. Omit refreshToken (or send allDevices=true) to
        revoke every session for the caller. Presenting another user's refresh token does
        nothing.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                allDevices:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'

  /refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token; returns new JWT pair
      description: >
        Single use — the presented token is revoked as part of the exchange, so a captured
        refresh token stops working as soon as the real client next refreshes.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New JWT pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [auth]
      summary: Current user profile
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [auth]
      summary: Edit your own display name / username
      description: >
        Phone and email are login credentials and are not editable here — they change
        through /me/phone and /me/email, which verify the new value with a code first.
        Omitted fields are left unchanged; a blank value is rejected.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Blank name, or a malformed / too-short username
        '403':
          description: Admin usernames are super-admin managed
        '409':
          description: That username is already taken
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/login:
    post:
      tags: [admin]
      summary: Admin step 1 — username + password; on success OTPs the phone on file
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Credentials valid; OTP sent. Complete with /verify-otp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'

  /admins:
    post:
      tags: [admin]
      summary: Super admin creates an ADMIN account
      operationId: createAdmin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '200':
          description: Admin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users:
    get:
      tags: [admin]
      summary: Admin lists users by status (e.g. PENDING approvals)
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, PENDING, REJECTED]
      responses:
        '200':
          description: Users with that status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/status:
    patch:
      tags: [admin]
      summary: Admin approves (ACTIVE) or rejects (REJECTED) a pending account
      operationId: reviewUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, REJECTED, SUSPENDED]
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/class:
    patch:
      tags: [admin]
      summary: Admin assigns a driver's vehicle class (e.g. Standard/Luxe after seeing the car)
      operationId: assignVehicleClass
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleClass]
              properties:
                vehicleClass:
                  type: string
                  enum: [OKADA, STANDARD, LUXE, CARGO]
      responses:
        '200':
          description: Class assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/service-mode:
    patch:
      tags: [auth]
      summary: Driver sets their own service mode
      operationId: setServiceMode
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [RIDES, DELIVERIES, BOTH]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /driver/kyc:
    post:
      tags: [kyc]
      summary: Driver submits KYC document references
      operationId: submitKyc
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycSubmitRequest'
      responses:
        '200':
          description: KYC record created (PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [kyc]
      summary: Admin lists KYC submissions (optionally by status)
      operationId: listKyc
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, VERIFIED, REJECTED]
      responses:
        '200':
          description: KYC submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KycResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /driver/kyc/{id}:
    patch:
      tags: [kyc]
      summary: Admin approves or rejects KYC
      operationId: reviewKyc
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycReviewRequest'
      responses:
        '200':
          description: KYC updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [phone, role]
      properties:
        phone:
          type: string
          example: "+233501234567"
        role:
          type: string
          enum: [RIDER, DRIVER, RESTAURANT_OWNER, COURIER, ADMIN, SUPER_ADMIN]
        name:
          type: string
          description: Display name — sent on first-time sign-up; ignored for an existing phone
        vehicleClass:
          type: string
          enum: [OKADA, CARGO]
          description: Driver self-selected class at sign-up (Okada/Truck). Omit for a car → admin sets Standard/Luxe.

    LoginRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: "+233501234567"

    EmailRegisterRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: "ama@example.com"
        role:
          type: string
          enum: [RIDER, DRIVER, RESTAURANT_OWNER, COURIER]
        name:
          type: string

    EmailLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    RegisterResponse:
      type: object
      properties:
        phone:
          type: string
        message:
          type: string

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminLoginResponse:
      type: object
      properties:
        phone:
          type: string
          description: Phone the OTP was sent to (use it in /verify-otp)
        message:
          type: string

    CreateAdminRequest:
      type: object
      required: [name, username, password, phone]
      properties:
        name:
          type: string
        username:
          type: string
        password:
          type: string
        phone:
          type: string

    VerifyOtpRequest:
      type: object
      required: [code]
      description: Provide exactly one of phone or email (matching how the OTP was requested).
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        code:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        role:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UpdateProfileRequest:
      type: object
      description: Fields omitted (null) are left unchanged.
      properties:
        name:
          type: string
          maxLength: 100
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-z0-9._]{3,30}$'
          description: Lower-cased server-side; unique across all accounts

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        role:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, PENDING, REJECTED]
        vehicleClass:
          type: string
          nullable: true
          enum: [OKADA, STANDARD, LUXE, CARGO]
          description: Driver class; null for a car awaiting an admin tier
        serviceMode:
          type: string
          enum: [RIDES, DELIVERIES, BOTH]

    KycSubmitRequest:
      type: object
      properties:
        licenceNo:
          type: string
        vehicleReg:
          type: string
        roadworthyUrl:
          type: string
        idSelfieUrl:
          type: string

    KycReviewRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [VERIFIED, REJECTED]
        expiryDate:
          type: string
          format: date

    KycResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        licenceNo:
          type: string
        vehicleReg:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
