openapi: "3.0.3"
info:
  title: GoZone Food Service — GoBite
  version: "1.0.0"
  description: |
    Restaurants, menus, orders in three modes (DELIVERY / PICKUP / WALKIN),
    virtual queue engine, and delivery courier tracking reusing the ride primitive.
servers:
  - url: http://localhost:8080/food
    description: Via gateway (dev)

security:
  - bearerAuth: []

tags:
  - name: restaurants
  - name: orders
  - name: delivery
  - name: queue
  - name: ratings

paths:

  /food/admin/vendors:
    get:
      tags: [Admin]
      summary: Businesses awaiting review (or all of them)
      description: >
        A business is approved separately from the account that owns it. Approving a person is a
        check on who they are; this is a check on a shop, and an already-approved owner can open a
        second one.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: approval, in: query, required: false, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
      responses:
        '200':
          description: Businesses
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/VendorResponse' } }
        '403': { description: Not an admin }

  /food/admin/vendors/{id}/approval:
    patch:
      tags: [Admin]
      summary: Clear a business to trade, or refuse it
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
                note:
                  type: string
                  description: >
                    Why. Required when rejecting — the owner is shown it, so it has to say what to
                    change. Cleared on approval.
      responses:
        '200':
          description: Updated business
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorResponse' }
        '400': { description: Rejected without a reason }
        '403': { description: Not an admin }
  /restaurants:
    get:
      tags: [restaurants]
      summary: List available restaurants
      operationId: listRestaurants
      responses:
        '200':
          description: Restaurant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VendorResponse'

  /vendors:
    post:
      tags: [restaurants]
      summary: Vendor onboarding — create the owner's business record
      operationId: createVendor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVendorRequest'
      responses:
        '200':
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponse'

  /vendors/mine:
    get:
      tags: [restaurants]
      summary: The signed-in owner's businesses
      operationId: myVendors
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owner's vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VendorResponse'

  /vendors/{id}:
    patch:
      tags: [restaurants]
      summary: A vendor edits their own business, storefront included
      description: >
        Partial update — every field is optional and null means "leave alone", so a screen can
        send only what the owner changed rather than round-tripping the whole record.
        A blank `name` is rejected; blank `description`, `imageUrl` and `address` are treated as
        a deliberate clear. Coordinates are accepted only as a pair, since half a location would
        silently move the business onto a different meridian and misroute every courier.
        Owner-guarded: the id is in the path, the authority comes from the token (403 otherwise).
      operationId: updateVendor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                vendorType:
                  type: string
                  enum: [RESTAURANT, PHARMACY, GROCERY, CONVENIENCE, OTHER]
                lat: { type: number, format: double }
                lng: { type: number, format: double }
                address: { type: string, nullable: true }
                description: { type: string, nullable: true }
                imageUrl: { type: string, nullable: true }
                prepMinutes: { type: integer }
                status:
                  type: string
                  enum: [OPEN, CLOSED, PAUSED]
      responses:
        '200':
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponse'
        '400':
          description: Blank name, unknown type/status, or only one of lat/lng
        '403':
          description: Not your business

  /promos:
    get:
      tags: [restaurants]
      summary: Active promo cards for the shop carousel
      operationId: listPromos
      responses:
        '200':
          description: Active promos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PromoResponse' }
    post:
      tags: [restaurants]
      summary: Admin creates a promo
      operationId: createPromo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePromoRequest' }
      responses:
        '200':
          description: Promo created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoResponse' }

  /promos/all:
    get:
      tags: [restaurants]
      summary: Admin lists all promos (incl. inactive)
      operationId: listAllPromos
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All promos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PromoResponse' }

  /promos/apply:
    post:
      tags: [restaurants]
      summary: Vendor applies to promote their business (created inactive; admin activates = approves)
      operationId: applyPromo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePromoRequest' }
      responses:
        '200':
          description: Application recorded (inactive promo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoResponse' }

  /promos/mine:
    get:
      tags: [restaurants]
      summary: Vendor lists their promo applications for one of their businesses
      operationId: myPromos
      security: [{ bearerAuth: [] }]
      parameters: [{ name: vendorId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: The vendor's promos (active + pending)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PromoResponse' }

  /promos/{id}:
    patch:
      tags: [restaurants]
      summary: Admin toggles a promo active/inactive
      operationId: setPromoActive
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { active: { type: boolean } } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoResponse' }
    delete:
      tags: [restaurants]
      summary: Admin deletes a promo
      operationId: deletePromo
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204':
          description: Deleted

  /restaurants/{id}/menu:
    get:
      tags: [restaurants]
      summary: Get restaurant menu (available items only)
      operationId: getMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItemResponse'
    post:
      tags: [restaurants]
      summary: Add/update menu item (restaurant owner)
      operationId: upsertMenuItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '200':
          description: Menu item saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'

  /restaurants/{id}/catalogue:
    get:
      tags: [restaurants]
      summary: Vendor's full catalogue incl. sold-out items (owner only)
      operationId: getCatalogue
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: All menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItemResponse'

  /menu-items/{id}:
    patch:
      tags: [restaurants]
      summary: Edit a menu item (owner only)
      operationId: updateMenuItem
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
    delete:
      tags: [restaurants]
      summary: Delete a menu item (owner only)
      operationId: deleteMenuItem
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

  /restaurants/{id}/orders:
    get:
      tags: [restaurants]
      summary: Restaurant order board (dashboard)
      operationId: getRestaurantOrders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active orders for this restaurant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

  /platform-fees:
    get:
      tags: [fees]
      summary: Current platform fees (service % + distance-based delivery rates)
      operationId: getPlatformFees
      responses:
        '200':
          description: Fee config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformFees'
    patch:
      tags: [fees]
      summary: Admin updates platform fees
      operationId: updatePlatformFees
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformFees'
      responses:
        '200':
          description: Updated fee config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformFees'

  /orders:
    post:
      tags: [orders]
      summary: Place an order (DELIVERY / PICKUP / WALKIN)
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  /orders/{id}/pay:
    post:
      tags: [orders]
      summary: Customer pays for an order (wallet/card/momo settle now; cash → awaiting)
      operationId: payOrder
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { method: { type: string, enum: [wallet, card, momo, cash] } } }
      responses:
        '200':
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }

  /orders/{id}/confirm-cash:
    post:
      tags: [orders]
      summary: Vendor/courier confirms cash received → marks the order paid
      operationId: confirmOrderCash
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Marked paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }

  /restaurants/{id}/awaiting-cash:
    get:
      tags: [orders]
      summary: Orders awaiting a cash confirmation for a vendor
      operationId: awaitingCash
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Awaiting-cash orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderResponse' }

  /orders/{id}/status:
    patch:
      tags: [orders]
      summary: Restaurant advances order status
      operationId: updateOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Status updated; READY triggers push + SMS within 10s
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  /orders/{id}/leave-time:
    get:
      tags: [orders]
      summary: When a collecting customer should set off
      description: >
        Walk-in and pickup orders only — a delivery is brought to the customer, so there is no
        journey to time (409). Once the kitchen starts cooking the estimate counts down against
        elapsed prep time, so polling this endpoint is what makes the figure move.
        Coordinates are deliberately query parameters rather than stored on the order: what
        matters is where the customer is when they ask. Without them the travel leg is omitted
        and only the ready time is returned.
      operationId: orderLeaveTime
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lat
          in: query
          required: false
          schema: { type: number, format: double }
        - name: lng
          in: query
          required: false
          schema: { type: number, format: double }
      responses:
        '200':
          description: Ready time, and when to leave if coordinates were supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveTimeResponse'
        '409':
          description: Delivery order — nothing to set off for

  /orders/{id}/rate:
    post:
      tags: [ratings]
      summary: Post-order rating
      operationId: rateOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '200':
          description: Rating recorded

  /deliveries/available:
    get:
      tags: [delivery]
      summary: Courier feed — unassigned deliveries to pick up
      operationId: availableDeliveries
      responses:
        '200':
          description: Unassigned deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryResponse'

  /deliveries/mine:
    get:
      tags: [delivery]
      summary: The signed-in courier's deliveries
      operationId: myDeliveries
      responses:
        '200':
          description: Courier's deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryResponse'

  /deliveries/{id}/accept:
    post:
      tags: [delivery]
      summary: Courier claims an unassigned delivery
      operationId: acceptDelivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery assigned to the courier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'

  /deliveries/{orderId}/assign:
    post:
      tags: [delivery]
      summary: Assign nearest available courier to a delivery order
      operationId: assignCourier
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Courier assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'

  /deliveries/{id}/status:
    patch:
      tags: [delivery]
      summary: Courier advances delivery state
      operationId: updateDeliveryStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryStatusUpdate'
      responses:
        '200':
          description: Delivery status updated; OUT_FOR_DELIVERY → push; DELIVERED → push
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'

  /deliveries/{id}/confirm-cash:
    post:
      tags: [delivery]
      summary: Courier confirms cash collected on hand-off for their delivery order
      description: >
        For a cash-payment delivery order, the courier (not the vendor) collects the money
        and confirms here → the order's paymentStatus becomes PAID. Only the assigned courier
        may confirm, and only for cash orders.
      operationId: confirmDeliveryCash
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cash confirmed; order marked PAID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'

  /queue/join:
    post:
      tags: [queue]
      summary: Join walk-in queue remotely
      operationId: joinQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueJoinRequest'
      responses:
        '201':
          description: Joined; returns live position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntryResponse'

  /queue/{restaurantId}/position:
    get:
      tags: [queue]
      summary: Live queue position and estimated wait
      operationId: getQueuePosition
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Position info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePositionResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PromoResponse:
      type: object
      description: >
        A promotion. DISCOUNT promos are applied by the platform at checkout;
        BOGO/OTHER are fulfilled by the vendor and only recorded on the order.
        `scope` decides both what a discount covers and where the card links.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        description: { type: string, nullable: true, description: Terms shown for vendor-fulfilled promos }
        color: { type: string }
        imageUrl: { type: string, nullable: true, description: Card background; falls back to color }
        vendorId: { type: string, format: uuid, nullable: true }
        category: { type: string, nullable: true, description: Target when scope = CATEGORY }
        menuItemId: { type: string, format: uuid, nullable: true, description: Target when scope = ITEM }
        promoKind: { type: string, enum: [DISCOUNT, BOGO, OTHER] }
        discountType: { type: string, enum: [PERCENT, AMOUNT], nullable: true }
        discountValue: { type: number, nullable: true }
        scope: { type: string, enum: [VENDOR, CATEGORY, ITEM] }
        active: { type: boolean, description: Doubles as the approval flag for vendor applications }

    CreatePromoRequest:
      type: object
      required: [title]
      description: >
        Used by both POST /promos (admin, goes live immediately) and
        POST /promos/apply (vendor, created inactive pending admin approval).
        A DISCOUNT requires a vendor plus discountType and discountValue;
        scope CATEGORY requires category, scope ITEM requires menuItemId.
      properties:
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        color: { type: string }
        imageUrl: { type: string }
        vendorId: { type: string, format: uuid }
        scope: { type: string, enum: [VENDOR, CATEGORY, ITEM], default: VENDOR }
        category: { type: string }
        menuItemId: { type: string, format: uuid }
        promoKind: { type: string, enum: [DISCOUNT, BOGO, OTHER], default: DISCOUNT }
        discountType: { type: string, enum: [PERCENT, AMOUNT] }
        discountValue: { type: number, description: Percent (max 90) or a fixed GHS amount }

    CreateVendorRequest:
      type: object
      required: [name, vendorType]
      properties:
        name:
          type: string
        vendorType:
          type: string
          enum: [RESTAURANT, PHARMACY, GROCERY, CONVENIENCE, OTHER]
        lat:
          type: number
        lng:
          type: number

    VendorResponse:
      type: object
      properties:
        logoUrl:
          type: string
          nullable: true
          description: >
            Square shop mark; imageUrl is the wide banner. Both must be paths returned by
            POST /auth/uploads?visibility=public — a pasted link is refused with 400, because the
            banner sits on a page customers read and a hotlink can rot or be swapped after approval.
        approvalStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          description: >
            Whether an admin has cleared this business to trade. Distinct from `status`, which is
            the shop's own open/closed switch. GET /food/restaurants only returns APPROVED ones.
        approvalNote:
          type: string
          nullable: true
          description: Why it was refused — shown to the owner.
        ownerId: { type: string, format: uuid }
        id:
          type: string
          format: uuid
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        status:
          type: string
          enum: [OPEN, CLOSED, PAUSED]
        prepMinutes:
          type: integer
        vendorType:
          type: string
          enum: [RESTAURANT, PHARMACY, GROCERY, CONVENIENCE, OTHER]
          description: What the vendor sells; orders/queue/delivery behave the same for all types.
        description:
          type: string
          nullable: true
          description: >
            The storefront a customer reads before ordering. Null until the vendor writes one —
            there was no editor for any of this until recently, so every storefront was whatever
            the seed said. The customer app falls back to its bundled metadata when these are
            null, which is why the seeded vendors are unaffected.
        imageUrl:
          type: string
          nullable: true
          description: Cover photo link. Null falls back to the app's bundled stock imagery.
        address:
          type: string
          nullable: true
          description: Human-readable location line; lat/lng route the courier, this tells the customer.

    MenuItemRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        price:
          type: number
        available:
          type: boolean
          default: true

    MenuItemResponse:
      type: object
      properties:
        imageUrl:
          type: string
          nullable: true
          description: Photo of the dish. Null falls back to the customer app's bundled imagery.
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          description: Vendor-defined grouping; what a CATEGORY-scoped promo targets
        price:
          type: number
        available:
          type: boolean
        groups:
          type: array
          description: Add-on groups a customer can choose from
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              multi: { type: boolean, description: false = pick one, true = pick many }
              required: { type: boolean }
              options:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    label: { type: string }
                    price: { type: number }

    PlatformFees:
      type: object
      properties:
        serviceFeePct:
          type: number
          description: Fraction of the food subtotal (e.g. 0.05 = 5%)
        deliveryBaseFee:
          type: number
        deliveryPerKm:
          type: number

    PlaceOrderRequest:
      type: object
      required: [restaurantId, items, mode]
      properties:
        restaurantId:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            properties:
              menuItemId:
                type: string
                format: uuid
              qty:
                type: integer
              addonOptionIds:
                type: array
                items: { type: string, format: uuid }
                description: Selected add-on option ids for this line
        mode:
          type: string
          enum: [DELIVERY, PICKUP, WALKIN]
        deliveryAddr:
          type: string
          description: Required when mode=DELIVERY
        deliveryLat:
          type: number
          description: Customer coords for the distance-based delivery fee (DELIVERY)
        deliveryLng:
          type: number

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        mode:
          type: string
        status:
          type: string
        total:
          type: number
        deliveryFee:
          type: number
        serviceFee:
          type: number
        discount:
          type: number
          description: Money removed by an applied DISCOUNT promo (0 when none)
        promoLabel:
          type: string
          nullable: true
          description: Snapshot of the applied discount promo's terms
        promoNotes:
          type: string
          nullable: true
          description: Vendor-fulfilled promos in effect, for customer and vendor to see
        deliveryLat:
          type: number
          nullable: true
          description: >
            Where the delivery is going. Null for pickup/walk-in and for orders placed before
            this was persisted — the checkout has always sent it, but it was previously used
            only to price the delivery fee and then discarded, which left live tracking with no
            destination to draw.
        deliveryLng:
          type: number
          nullable: true
        restaurantLat:
          type: number
          nullable: true
          description: Vendor's position, included so a tracking screen needs no second call
        restaurantLng:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        paymentStatus:
          type: string
          enum: [UNPAID, AWAITING, PAID]
        paymentMethod:
          type: string
          nullable: true

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CONFIRMED, PREPARING, READY, COMPLETED, CANCELLED]

    LeaveTimeResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        position:
          type: integer
          nullable: true
          description: Queue position; null for a pickup order, which has no queue
        peopleAhead:
          type: integer
          description: Recomputed from who is still waiting, not read off the ticket number
        readyInMinutes:
          type: integer
          description: >
            Minutes until the food is ready. Before cooking starts this is the queue ahead plus
            the order's own prep; once cooking it is the remaining prep, i.e. it counts down.
            Floors at 1 while still cooking — only a READY order returns 0.
        travelMinutes:
          type: integer
          nullable: true
          description: Straight-line travel at city speed; null when no coordinates were supplied
        leaveInMinutes:
          type: integer
          nullable: true
          description: >
            readyInMinutes minus travel and a safety buffer. Negative means already late to set
            off, so the app should say "leave now". Null when no coordinates were supplied.
        status:
          type: string
          description: The order's current status

    DeliveryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        vendorName:
          type: string
        dropoffAddr:
          type: string
          nullable: true
        vendorLat:
          type: number
          nullable: true
          description: >
            Collection point. Couriers previously received only names and an address string, so
            the app's position updates followed a path hardcoded into it — the same stretch of
            central Accra whichever restaurant the order came from, which put the courier nowhere
            near the food on the customer's tracking map.
        vendorLng:
          type: number
          nullable: true
        dropoffLat:
          type: number
          nullable: true
          description: Destination. Null on orders placed before it was persisted.
        dropoffLng:
          type: number
          nullable: true
        total:
          type: number
        status:
          type: string
          enum: [ASSIGNED, PICKED_UP, ENROUTE, DELIVERED]
        courierId:
          type: string
          format: uuid
          nullable: true
          description: Null until a courier accepts
        paymentMethod:
          type: string
          nullable: true
          description: wallet | cash | momo | card (null if not yet paid)
        paymentStatus:
          type: string
          enum: [UNPAID, AWAITING, PAID]
          description: AWAITING for cash until the courier confirms collection

    DeliveryStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PICKED_UP, ENROUTE, DELIVERED]

    QueueJoinRequest:
      type: object
      required: [restaurantId]
      properties:
        restaurantId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid

    QueueEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        status:
          type: string
          enum: [WAITING, CALLED, SERVED]

    QueuePositionResponse:
      type: object
      properties:
        position:
          type: integer
        totalAhead:
          type: integer
        estimatedWaitMinutes:
          type: integer
        status:
          type: string

    RatingRequest:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
