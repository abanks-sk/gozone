openapi: "3.0.3"
info:
  title: GoZone Ride Service — GoRide
  version: "1.0.0"
  description: |
    inDrive-style fare bidding × trotro-style sharing.
    Simplified pooling: corridor + haversine fair-share (no real route geometry).
servers:
  - url: http://localhost:8080/rides
    description: Via gateway (dev)

security:
  - bearerAuth: []

tags:
  - name: requests
  - name: trips
  - name: tracking
  - name: pooling
  - name: ratings

paths:

  /rides/ratings/me:
    get:
      tags: [Ratings]
      summary: Your own rating
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingSummary' }

  /rides/ratings/{userId}:
    get:
      tags: [Ratings]
      summary: Someone else's rating (a passenger comparing drivers who have offered)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingSummary' }
  /quote:
    post:
      tags: [pricing]
      summary: Server-authoritative fare quote for a trip
      description: >
        Computes (base + perKm × haversine distance) × ride-type multiplier × surge,
        floored at a minimum fare. Surge is time-based (peak commute hours). The app
        shows the returned fare as the anchor; bargainable ride types may still adjust.
      operationId: quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Fare quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'

  /requests:
    post:
      tags: [requests]
      summary: Rider posts a ride request with proposed fare
      operationId: createRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideRequest'
      responses:
        '201':
          description: Request created; broadcasted to nearby drivers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideRequestResponse'

  /requests/nearby:
    get:
      tags: [requests]
      summary: Driver feed — open requests within radius (PostGIS)
      operationId: getNearbyRequests
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radiusKm
          in: query
          schema:
            type: number
            default: 5
        - name: vehicleClass
          in: query
          required: false
          schema:
            type: string
            enum: [OKADA, STANDARD, LUXE, CARGO]
          description: Filter to requests this driver class can take (omit = no filtering)
        - name: serviceMode
          in: query
          required: false
          schema:
            type: string
            enum: [RIDES, DELIVERIES, BOTH]
      responses:
        '200':
          description: List of open requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RideRequestResponse'

  /requests/{id}/status:
    get:
      tags: [requests]
      summary: Rider polls their own request — status + matched trip (null until accepted)
      operationId: getRequestStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Combined request status and matched trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideStatusResponse'

  /requests/{id}/bid:
    post:
      tags: [requests]
      summary: >
        Driver places an offer (ACCEPT pins the rider's fare, COUNTER carries the
        driver's amount). Both become PENDING — the trip is created only when the
        rider accepts an offer, so several drivers can accept and the rider picks
        by distance/driver. Re-offering updates the driver's existing offer.
      operationId: placeBid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidRequest'
      responses:
        '200':
          description: Offer placed (PENDING); poll GET /bids/{bidId} for the outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidResponse'

  /bids/{id}:
    get:
      tags: [requests]
      summary: Driver polls their own offer — ACCEPTED (+tripId) / REJECTED / request dead
      operationId: bidStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Offer status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidStatusResponse'
    delete:
      tags: [requests]
      summary: Driver withdraws their pending offer
      operationId: withdrawBid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Offer withdrawn (no-op if already decided)

  /trips/mine:
    get:
      tags: [trips]
      summary: Rider's ride history (upcoming/scheduled + active + past)
      operationId: myRides
      responses:
        '200':
          description: Ride history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RideHistoryItem'

  /driver/trips:
    get:
      tags: [trips]
      summary: Driver's or courier's own job history, newest first
      description: >
        The counterpart to /trips/mine. Deliberately NOT gated on STATUS_ACTIVE — a suspended
        driver must still be able to see and settle cash from work already done. `cashToConfirm`
        counts passengers whose cash handover the driver has not yet acknowledged.
      operationId: driverTrips
      responses:
        '200':
          description: Job history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverTripItem'

  /requests/{id}/bids:
    get:
      tags: [requests]
      summary: Rider lists pending driver offers on their request
      operationId: listBids
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pending offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BidOffer'

  /requests/{id}/bids/{bidId}/accept:
    post:
      tags: [requests]
      summary: Rider accepts a driver's offer → creates the trip at that fare
      operationId: acceptBid
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: bidId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Offer accepted; trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

  /trips/{id}:
    get:
      tags: [trips]
      summary: Get a trip (incl. payment status) — used by the driver to poll for cash
      operationId: getTrip
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Trip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }

  /trips/{id}/pay:
    post:
      tags: [trips]
      summary: Rider pays for a trip (wallet/card/momo settle now; cash → awaiting driver)
      operationId: payTrip
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { method: { type: string, enum: [wallet, card, momo, cash] } } }
      responses:
        '200':
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }

  /trips/{id}/confirm-cash:
    post:
      tags: [trips]
      summary: Driver confirms cash received
      description: >
        riderId names which passenger handed money over — on a shared ride two people owe two
        different amounts at two different kerbs, and confirming "the trip" would credit one
        person's cash to everybody. Omit it to clear every passenger still awaiting cash, which on
        an ordinary single-passenger trip is the only sensible reading.
      operationId: confirmCash
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                riderId: { type: string, format: uuid }
      responses:
        '200':
          description: Marked paid (the trip flips to PAID only once every passenger has)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '404':
          description: No cash payment is waiting to be confirmed

  /trips/{id}/status:
    patch:
      tags: [trips]
      summary: Advance trip state machine
      operationId: updateTripStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusUpdate'
      responses:
        '200':
          description: Trip status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

  /requests/{id}/pool-offers:
    get:
      tags: [pooling]
      summary: Shared rides already on the road that this request could join
      description: >
        Polled by the rider alongside driver offers while they wait, so the two appear together as
        alternatives: take a driver's price, counter it, or step into a car that is going your way
        anyway for less. A match needs all three of — destination within the corridor radius, pickup
        within the detour limit of the road still to be driven, and a direction of travel that
        agrees with the car's. Returns an empty list whenever nothing qualifies, which is the
        ordinary case, not an error.
      operationId: getPoolOffers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Joinable rides, least detour first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoolOffer'
        '403':
          description: Not your ride request

  /trips/{id}/pool-join:
    post:
      tags: [pooling]
      summary: Rider steps into a shared ride already under way
      description: >
        Re-runs every check the offer list made, because that list is a poll of a moving world: the
        car can fill, the trip can finish and the rider's own request can be matched to a driver
        between the offer being drawn and the tap landing. Joining re-prices EVERY passenger from
        their own solo fare at the new occupancy — capped at that solo fare, so nobody is ever
        charged more than they agreed at booking — and the trip's agreedFare becomes the sum, so the
        driver earns more from carrying two people at a discount than one at full price.
      operationId: poolJoin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolJoinRequest'
      responses:
        '200':
          description: Joined; the joiner's fare is locked and rule_version stamped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolJoinResponse'
        '400':
          description: That ride isn't shared
        '403':
          description: Not your ride request, or you are driving this trip
        '409':
          description: Ride full, already finished, no longer going your way, or you are already aboard

  /trips/{id}/passengers/{riderId}/picked-up:
    post:
      tags: [pooling]
      summary: Driver confirms a passenger is in the car
      description: >
        Only needed for people who joined en route — the passenger who booked is stamped
        automatically when the trip goes STARTED, which is what that transition already means. A
        joiner boards at their own kerb minutes later on a trip that is already under way, so no
        trip-level status can speak for them. This closes their exit: before it they can leave-pool
        and owe nothing, after it the fare is owed. Idempotent. Allowed only while ENROUTE or
        STARTED, so a driver cannot mark somebody aboard at match time and strand them.
      operationId: markPickedUp
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: riderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Passenger marked as aboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPassengerResponse' }
        '403':
          description: Not your trip
        '404':
          description: That passenger isn't on this trip
        '409':
          description: The trip is not on the road yet
    delete:
      tags: [pooling]
      summary: Driver takes back a pickup confirmed by mistake
      description: >
        Re-opens that passenger's exit. Confirming a pickup traps somebody who is not actually in
        the car — they cannot leave and will be billed for a ride they never took — so this is the
        way out of a mis-tap. Time-boxed (app.pooling.pickup-undo-seconds, default 300): a mis-tap
        is noticed in seconds, whereas an open-ended undo would turn "aboard and owes the fare" into
        something revocable at any point in the journey, giving back the very protection the pickup
        confirmation provides. Refused once the passenger has paid, or the trip has finished — both
        are refund questions, and refunds are not built.
      operationId: undoPickup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: riderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pickup undone; the passenger may leave again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPassengerResponse' }
        '403':
          description: Not your trip
        '404':
          description: That passenger isn't on this trip
        '409':
          description: >
            Not marked as on board, already paid, the trip has finished, or the undo window
            has passed

  /trips/{id}/dispute-pickup:
    post:
      tags: [pooling]
      summary: Passenger says they are not in that car
      description: >
        The other half of boarding. Confirming a pickup puts a fare on somebody by one person's
        assertion; this is how the person it lands on answers back. It deliberately does NOT clear
        the boarding flag — a dispute that un-boarded on demand would be the free-ride hole entered
        from the passenger's side (ride the whole way, object at the drop-off, walk away). Instead
        it records the objection, notifies the driver, and while it is open the driver may undo the
        pickup at ANY time rather than only inside the usual short window. Raising it twice keeps
        the original timestamp. Undoing the pickup closes the dispute.
      operationId: disputePickup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: What the passenger says }
      responses:
        '200':
          description: Objection recorded; boarding unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPassengerResponse' }
        '403':
          description: You're not on this ride
        '409':
          description: You're not marked as on board, or you have already paid

  /pickup-disputes:
    get:
      tags: [pooling]
      summary: "Admin: pickup disputes"
      description: >
        The backstop when a driver will not correct one. ADMIN/SUPER_ADMIN only. Most disputes never
        reach here — the driver undoes the pickup as soon as they are told, which settles it and
        drops it off the open list. What remains is a disagreement. Carries both parties' phone
        numbers because that is how these are actually settled; a truncated UUID is not something
        anyone can act on. Each round of the same argument is a separate row — settling one never
        overwrites the last decision — and rows survive the passenger leaving the ride.
      operationId: listPickupDisputes
      parameters:
        - name: openOnly
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: True (default) = the live queue. False also returns settled ones.
      responses:
        '200':
          description: Disputes, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PickupDisputeResponse' }
        '403':
          description: Not an admin

  /pickup-disputes/{tripId}/{riderId}:
    patch:
      tags: [pooling]
      summary: "Admin: settle a pickup dispute"
      description: >
        UPHELD takes the passenger off the ride — picked_up_at is cleared, so they may leave again
        and are not charged. Anything else refuses it and they stay on, which is why a refusal
        REQUIRES a note (400 without one): the passenger reads it, and "rejected" with no reason is
        not an answer. Either way the dispute is marked resolved rather than deleted — what was
        claimed and what was decided both stay on the record.
      operationId: resolvePickupDispute
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: riderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [UPHELD, REJECTED] }
                note: { type: string, description: Required when refusing; shown to the passenger }
      responses:
        '200':
          description: Settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupDisputeResponse' }
        '400':
          description: Refusing without a reason
        '403':
          description: Not an admin
        '404':
          description: That passenger isn't on this trip
        '409':
          description: There is no open dispute on that passenger


  /trips/{id}/leave-pool:
    post:
      tags: [pooling]
      summary: A joiner gets out of a shared ride
      description: >
        Not the same as cancelling. A shared ride belongs to whoever booked it, and only they may
        cancel it — a joiner leaving must not end a journey the other passenger is halfway through.
        Only before boarding: once the driver has confirmed them in the car
        (picked-up) the exit closes, or a passenger could ride the whole way and then leave rather
        than pay. Leaving drops the seat, CANCELS the leaver's request (not re-opened: an immediate request
        expires on created_at, so one that has sat in a car for ten minutes would be swept away
        moments after appearing to work) and re-prices whoever is left, back up to at most the fare
        they agreed at booking. Blocked once the leaver has paid — refunds are not built.
      operationId: leavePool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Left; the ride continues for everyone else
        '400':
          description: You booked this ride — cancel it instead of leaving it
        '403':
          description: You're not on this ride
        '409':
          description: The ride has finished, you are already aboard, or you have already paid

  /trips/{id}/passengers:
    get:
      tags: [pooling]
      summary: Everyone on a trip
      description: >
        The driver's pickup list, or who a passenger is sharing with. riderPhone is populated only
        for the driver.
      operationId: getTripPassengers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Passengers in boarding order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripPassengerResponse'
        '403':
          description: Not your trip

  /trips/{id}/pool-candidates:
    post:
      tags: [pooling]
      summary: Open requests this driver could pick up along their route
      description: >
        The other direction through the same matcher, so the driver's screen and the rider's offer
        list can never disagree. Informational only — a driver cannot seat anybody; only pool-join,
        called by the rider, puts someone in the car.
      operationId: getPoolCandidates
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Compatible open requests (empty unless this trip is shared and has room)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RideRequestResponse'

  /locations:
    post:
      tags: [tracking]
      summary: Driver pushes GPS location
      operationId: pushLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
      responses:
        '204':
          description: Location stored

  /trips/{id}/rate:
    post:
      tags: [ratings]
      summary: Two-way rating after trip completion
      description: >
        One rating per rater PER PERSON, not per trip — a shared ride carries several passengers
        and the driver has an opinion about each. The ratee must actually have been on the trip
        (the driver, or one of its passengers), or the endpoint would take any UUID and become a
        way to move a stranger's average.
      operationId: rateTrip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '200':
          description: Rating recorded; aggregates updated
        '400':
          description: That person wasn't on this trip
        '403':
          description: You weren't on this trip
        '409':
          description: You've already rated them for this trip

  /trips/{id}/sos:
    post:
      tags: [trips]
      summary: SOS — records an incident triaged on the admin web app
      operationId: sos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
      responses:
        '200':
          description: Incident recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SosIncident'

  /sos:
    get:
      tags: [trips]
      summary: Admin — all SOS incidents, newest first (ADMIN/SUPER_ADMIN)
      operationId: listSos
      responses:
        '200':
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SosIncident'

  /sos/{id}/handle:
    patch:
      tags: [trips]
      summary: Admin — mark an SOS incident handled
      operationId: handleSos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Incident updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SosIncident'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RatingSummary:
      type: object
      properties:
        userId: { type: string, format: uuid }
        average:
          type: number
          nullable: true
          description: >
            Mean score to one decimal, or null until at least three people have rated them —
            clients show "New driver" rather than an average of one or two scores.
        count:
          type: integer
          description: How many ratings exist, whether or not they are enough to average.
    QuoteRequest:
      type: object
      required: [originLat, originLng, destLat, destLng]
      properties:
        originLat:
          type: number
        originLng:
          type: number
        destLat:
          type: number
        destLng:
          type: number
        rideType:
          type: string
          enum: [STANDARD, PREMIUM, OKADA]
          default: STANDARD

    QuoteResponse:
      type: object
      properties:
        distanceKm:
          type: number
        fare:
          type: number
          description: Suggested/anchor fare after type multiplier + surge
        baseFare:
          type: number
          description: Distance fare before type/surge
        rideType:
          type: string
        typeMultiplier:
          type: number
        surgeMultiplier:
          type: number
        surge:
          type: boolean
          description: True when a peak-hour surge is applied
        currency:
          type: string
          example: GHS
        ruleVersion:
          type: string

    CreateRideRequest:
      type: object
      required: [originLat, originLng, destLat, destLng, proposedFare]
      properties:
        originLat:
          type: number
        originLng:
          type: number
        destLat:
          type: number
        destLng:
          type: number
        seats:
          type: integer
          default: 1
        proposedFare:
          type: number
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Book for a future time; null/omitted = ride now
        kind:
          type: string
          enum: [RIDE, PARCEL]
          default: RIDE
        rideType:
          type: string
          enum: [STANDARD, LUXE, OKADA]
          default: STANDARD
        shared:
          type: boolean
          default: false
          description: >
            Willing to share the car with someone going the same way, for a cheaper fare.
            Rejected with 400 on anything but a STANDARD ride.
        parcelSize:
          type: string
          enum: [SMALL, MEDIUM, LARGE]
          nullable: true
        parcelDesc:
          type: string
          nullable: true
          description: What the parcel is (required by the client for parcels)
        direction:
          type: string
          enum: [SEND, RECEIVE]
          nullable: true
          description: >
            Parcels: which end the customer is at. SEND — they hand over at the pickup and the
            other party receives at the drop-off. RECEIVE — the other party hands over at the
            pickup and the customer collects at the drop-off.
        partyName:
          type: string
          nullable: true
          description: >
            The other person in the handover — the recipient when sending, the sender when
            receiving. Required for parcels (400 without it): a courier can't complete a
            handover without knowing who they are meeting.
        partyPhone:
          type: string
          nullable: true
          description: Required for parcels. Revealed only to the owner and the assigned courier.
        riderPhone:
          type: string
          nullable: true
          description: Customer's phone — revealed to the matched driver via TripResponse only

    RideRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        riderId:
          type: string
          format: uuid
        originLat:
          type: number
        originLng:
          type: number
        destLat:
          type: number
        destLng:
          type: number
        seats:
          type: integer
        proposedFare:
          type: number
        status:
          type: string
          enum: [OPEN, MATCHED, CANCELLED]
        kind:
          type: string
          enum: [RIDE, PARCEL]
        rideType:
          type: string
          enum: [STANDARD, LUXE, OKADA]
        shared:
          type: boolean
          description: The passenger opted into ride sharing — the driver feed labels these differently
        parcelSize:
          type: string
          enum: [SMALL, MEDIUM, LARGE]
          nullable: true
        parcelDesc:
          type: string
          nullable: true
        direction:
          type: string
          enum: [SEND, RECEIVE]
          nullable: true
        partyName:
          type: string
          nullable: true
          description: >
            Handover contact. Populated only for the request's owner — the open nearby feed
            returns null, so a driver browsing work cannot harvest third-party numbers.
        partyPhone:
          type: string
          nullable: true
          description: Owner only; null in the nearby feed.
        createdAt:
          type: string
          format: date-time

    RideStatusResponse:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/RideRequestResponse'
        trip:
          allOf:
            - $ref: '#/components/schemas/TripResponse'
          nullable: true
          description: Null until the rider accepts a driver's offer
        driver:
          allOf:
            - $ref: '#/components/schemas/BidOffer'
          nullable: true
          description: The winning driver's details (from the accepted offer)

    BidRequest:
      type: object
      required: [type, amount]
      properties:
        type:
          type: string
          enum: [ACCEPT, COUNTER]
        amount:
          type: number
        driverName: { type: string, nullable: true }
        driverPhone: { type: string, nullable: true }
        vehicle: { type: string, nullable: true, description: e.g. "Toyota Vitz · Silver" }
        plate: { type: string, nullable: true }
        lat: { type: number, nullable: true, description: Driver's position at bid time }
        lng: { type: number, nullable: true }

    RideHistoryItem:
      type: object
      properties:
        requestId: { type: string, format: uuid }
        tripId: { type: string, format: uuid, nullable: true }
        status: { type: string }
        fare: { type: number }
        originLat: { type: number }
        originLng: { type: number }
        destLat: { type: number }
        destLng: { type: number }
        scheduledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        # This passenger's own settlement, not the trip's — on a shared ride two people pay
        # separately. Null when the request never became a trip. An UNPAID COMPLETED entry is
        # what lets the app route someone back into paying a fare they walked away from.
        paymentStatus:
          type: string
          enum: [UNPAID, AWAITING, PAID]
          nullable: true
        paymentMethod: { type: string, nullable: true }

    DriverTripItem:
      type: object
      properties:
        tripId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        status: { type: string }
        # The whole fare the driver earns — on a shared trip, the sum of every passenger's share.
        fare: { type: number }
        kind: { type: string, enum: [RIDE, PARCEL] }
        paymentStatus: { type: string, enum: [UNPAID, AWAITING, PAID] }
        paymentMethod: { type: string, nullable: true }
        # Passengers whose cash handover the driver has not acknowledged, and what they owe.
        cashToConfirm: { type: integer }
        cashAmount: { type: number }
        originLat: { type: number }
        originLng: { type: number }
        destLat: { type: number }
        destLng: { type: number }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    BidOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        amount: { type: number }
        type: { type: string, enum: [ACCEPT, COUNTER] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        driverName: { type: string, nullable: true }
        driverPhone: { type: string, nullable: true }
        vehicle: { type: string, nullable: true }
        plate: { type: string, nullable: true }
        distanceKm:
          type: number
          nullable: true
          description: Driver → pickup straight-line km at bid time

    BidStatusResponse:
      type: object
      properties:
        bidId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, WITHDRAWN] }
        requestStatus: { type: string, enum: [OPEN, MATCHED, EXPIRED, CANCELLED] }
        tripId: { type: string, format: uuid, nullable: true }

    SosIncident:
      type: object
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid, nullable: true }
        userId: { type: string, format: uuid }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        status: { type: string, enum: [NEW, HANDLED] }
        createdAt: { type: string, format: date-time }

    BidResponse:
      type: object
      properties:
        bidId:
          type: string
          format: uuid
        status:
          type: string
        tripId:
          type: string
          format: uuid
          description: Set when bid results in a match

    TripStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ENROUTE, STARTED, COMPLETED, CANCELLED]

    TripResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        agreedFare:
          type: number
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        paymentStatus:
          type: string
          enum: [UNPAID, AWAITING, PAID]
        paymentMethod:
          type: string
          nullable: true
        riderPhone:
          type: string
          nullable: true
          description: The rider's phone (trip endpoints are participant-guarded)
        direction:
          type: string
          enum: [SEND, RECEIVE]
          nullable: true
          description: Parcels only — which end the customer is at
        partyName:
          type: string
          nullable: true
          description: Parcel handover contact, revealed to the assigned courier after a match
        partyPhone:
          type: string
          nullable: true
        shared:
          type: boolean
          description: This ride can pick up more passengers along its corridor
        passengerCount:
          type: integer
          description: How many people are aboard — 1 on an ordinary trip
        myFare:
          type: number
          nullable: true
          description: >
            What the CALLER personally owes. agreedFare is the whole trip's money (everybody's
            share added up, which is what the driver earns); on a shared ride that is not any one
            passenger's bill. Anything a passenger is asked to pay must read myFare.
            Null when the caller is the driver rather than a passenger.
        mySoloFare:
          type: number
          nullable: true
          description: What the caller would have paid alone, so the app can show what sharing saved
        myPickedUp:
          type: boolean
          nullable: true
          description: The driver has confirmed the caller is in the car; the app hides leave-pool once true
        myPickupDisputed:
          type: boolean
          nullable: true
          description: The caller has already objected, so the app does not offer it twice
        myPickupSeq:
          type: integer
          nullable: true
          description: >
            The caller's boarding position — 1 if they booked this ride, higher if they joined it.
            Tells "cancel the ride" from "get out of someone else's": only a joiner may leave-pool,
            only the booker may cancel. Null when the caller is the driver.

    PoolOffer:
      type: object
      description: A shared ride already on the road that the caller could get into.
      properties:
        tripId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        driverName: { type: string, nullable: true }
        vehicle: { type: string, nullable: true }
        plate: { type: string, nullable: true }
        driverLat:
          type: number
          nullable: true
          description: Where the car is now, so the offer can be drawn on the map before anyone commits
        driverLng: { type: number, nullable: true }
        destLat: { type: number }
        destLng: { type: number }
        yourFare:
          type: number
          description: What the caller would pay — the price the join actually executes at
        yourSoloFare: { type: number }
        currentFare:
          type: number
          description: What the passenger already aboard pays today
        newFare:
          type: number
          description: What they would pay once the caller joins — always lower, never higher
        savingPct: { type: integer }
        passengerCount:
          type: integer
          description: People already aboard (the caller would be this many plus one)
        detourKm:
          type: number
          description: How far off the car's remaining line the caller's pickup sits
        destGapKm: { type: number }
        ruleVersion: { type: string, example: v1 }

    TripPassengerResponse:
      type: object
      properties:
        riderId: { type: string, format: uuid }
        requestId: { type: string, format: uuid, nullable: true }
        pickupSeq:
          type: integer
          description: Boarding order — 1 is whoever booked the ride
        lockedFare: { type: number }
        soloFare: { type: number }
        paymentStatus: { type: string, enum: [UNPAID, AWAITING, PAID] }
        paymentMethod: { type: string, nullable: true }
        originLat: { type: number }
        originLng: { type: number }
        destLat: { type: number }
        destLng: { type: number }
        riderPhone:
          type: string
          nullable: true
          description: >
            Only ever populated for the driver. A passenger reading the same list gets it blanked —
            sharing a car with someone is not consent to hand them your number.
        pickedUpAt:
          type: string
          format: date-time
          nullable: true
          description: When the driver confirmed they were in the car; null while still a pickup to make

    PickupDisputeResponse:
      type: object
      description: >
        A disputed pickup as the admin deciding it sees it. Deliberately fuller than
        TripPassengerResponse: somebody is settling an argument about money between two people, and
        both phone numbers are here because that is how it gets settled. The driver's name and
        vehicle come from the accepted bid, so the board costs no cross-service call.
      properties:
        tripId: { type: string, format: uuid }
        tripStatus: { type: string }
        riderId: { type: string, format: uuid }
        riderPhone: { type: string, nullable: true }
        driverId: { type: string, format: uuid }
        driverName: { type: string, nullable: true }
        driverPhone: { type: string, nullable: true }
        vehicle: { type: string, nullable: true }
        plate: { type: string, nullable: true }
        lockedFare:
          type: number
          description: What the passenger is charged if the dispute fails
        pickupSeq: { type: integer }
        paymentStatus:
          type: string
          enum: [UNPAID, AWAITING, PAID, LEFT]
          description: >
            LEFT means the passenger raised this and then left the ride, so there is no seat or
            fare any more. The dispute outlives the seat on purpose — a driver who repeatedly marks
            people aboard who are not in the car is a pattern nobody could see if every complainant
            who walked away erased their own complaint.
        originLat: { type: number }
        originLng: { type: number }
        destLat: { type: number }
        destLng: { type: number }
        pickedUpAt: { type: string, format: date-time, nullable: true }
        disputedAt: { type: string, format: date-time }
        note: { type: string, nullable: true, description: What the passenger said }
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while open — this is what makes a row a live piece of work
        outcome:
          type: string
          nullable: true
          description: 'How it ended, e.g. "UPHELD — the driver undid the pickup themselves"'

    PoolJoinRequest:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid

    PoolJoinResponse:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
        lockedFare:
          type: number
          description: What the joiner now owes, after the sharing discount
        soloFare:
          type: number
          description: What they would have paid alone
        passengerCount:
          type: integer
          description: How many are now aboard, the joiner included
        ruleVersion:
          type: string
          example: v1

    LocationUpdate:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number

    RatingRequest:
      type: object
      required: [rateeId, score]
      properties:
        rateeId:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
